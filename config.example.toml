[actual]
base_url = "http://localhost:5006"
file = "My-Finances"
# ACTUAL_PASSWORD and ACTUAL_ENCRYPTION_PASSWORD come from .env, never config.toml

# ── Local llama.cpp setup (default) ─────────────────────────────────────────
[llm]
endpoint = "http://localhost:8900/v1"
# Server-side llama.cpp alias. Sampling below is pinned regardless of the
# preset's own defaults, so any model swap keeps categorization behavior stable.
model = "qwen35-122b"
# Sampling is pinned here rather than inherited from the server preset, so swapping
# the base preset (or its sampling defaults) can't change categorization behavior.
temperature = 0.2
top_p = 0.85
presence_penalty = 1.0
# json_mode = true   # send response_format=json_object (default); set false if your
                     # model rejects it (the code-fence fallback still works)
# Per-request cap on any LLM call. Without one the SDK default (600s) is long
# enough that a stalled call outlives a systemd TimeoutStartSec and the run is
# killed mid-call, logging nothing. Receipt OCR overrides this per pass.
timeout_seconds = 120

# llama.cpp-specific sampling params — send verbatim in extra_body.
# Omit this entire table when using a cloud provider.
[llm.extra_body]
top_k = 20
min_p = 0.05
chat_template_kwargs = { enable_thinking = false }   # keep reasoning off for JSON

# ── Optional: separate vision model (e.g. local text + cloud OCR) ────────────
# Omit [llm.vision] entirely to use the same model for text and vision.
# [llm.vision]
# endpoint = "https://openrouter.ai/api/v1"
# model    = "google/gemini-2.5-flash"
# json_mode = true
# LLM_VISION_API_KEY from .env

# ── Cloud provider examples (comment out the local block above, uncomment one) ─
#
# OpenRouter (any model):
# [llm]
# endpoint = "https://openrouter.ai/api/v1"
# model    = "google/gemini-2.5-flash"
# json_mode = true
# # LLM_API_KEY from .env; omit [llm.extra_body]
#
# Google Gemini (OpenAI-compat endpoint):
# [llm]
# endpoint = "https://generativelanguage.googleapis.com/v1beta/openai/"
# model    = "gemini-2.5-flash"
# json_mode = true
# # LLM_API_KEY from .env; omit [llm.extra_body]
# # On the free tier, add [llm.rate_limit] below to stay under the quota.
#
# OpenAI:
# [llm]
# endpoint = "https://api.openai.com/v1"
# model    = "gpt-4o-mini"
# json_mode = true
# # LLM_API_KEY from .env; omit [llm.extra_body]

# ── Optional: client-side rate limiting (cloud free tiers) ───────────────────
# Throttle outgoing requests and let the OpenAI SDK ride out 429s. Omit this
# table entirely for local servers (no throttle, SDK default of 2 retries).
# [llm.rate_limit]
# requests_per_minute = 15   # 0/omitted = no throttle; set to your provider's RPM
# max_retries = 5            # SDK retries on 429 w/ backoff, honoring Retry-After

[categorization]
mode = "suggest"                  # "suggest" | "apply"
apply_confidence_threshold = "high"

[transfers]
mode = "suggest"
window_days = 3
apply_confidence_threshold = "high"

# Pending-duplicate resolution — removes the pending authorization row left behind
# when its posted counterpart imports separately (tip added after authorization).
# Off by default; omitting the whole block leaves every other pipeline unchanged.
[duplicates]
enabled = false
mode = "suggest"                  # "suggest" | "apply" — apply DELETES the pending row
window_days = 7                   # symmetric: a posted row is sometimes dated earlier
max_uplift_pct = 40               # posted above pending (tip band ceiling)
max_reduction_pct = 5             # posted below pending
auth_hold_max_cents = 200         # ceiling for the $1-ish authorization-probe rule
apply_confidence_threshold = "high"
defer_pending = true              # other pipelines ignore rows the bank hasn't finalized

# Scheduled bank sync — the worker pulls fresh transactions itself, before the rule
# engine, instead of relying solely on actual-server's own sync schedule. Off by
# default; if actual-server already has its own schedule, leave this off or turn
# that off first — running both burns the provider's quota twice for no benefit.
[bank_sync]
enabled = false
interval_minutes = 360            # independent of the timer cadence; SimpleFIN/
                                   # GoCardless refresh a few times a day at most
grace_minutes = 5                 # absorbs the timer's RandomizedDelaySec jitter
max_runs_per_day = 0              # 0 = uncapped; set to the provider's per-account quota
accounts = []                     # empty = all sync-enabled accounts
exclude_accounts = []
lookback_days = 0                 # 0 = actualpy default (per-account last transaction date)
allow_first_sync = false          # guard the auto "Starting Balance" reconciliation row

[state]
path = "state/actual-cat.json"    # run-state for the bank_sync gate (due/cap tracking)

[audit]
log_path = "logs/actual-cat.jsonl"

[paths]
ca_bundle = "/etc/ssl/certs/ca-certificates.crt"

# Receipt-driven transaction splitting (all sections optional; feature is off by default)

[receipts]
enabled = false
store_path = "receipts"          # directory for inbox/pending/done receipt records
match_window_days = 3            # ± days around receipt date to search for matching txn
expiry_days = 30                 # unmatched receipts expire after this many days
mode = "suggest"                 # "suggest" | "apply"
apply_confidence_threshold = "high"
# OCR time bounds. A vision pass over a phone-camera receipt can cost ~100s against
# a large local model, and a low-confidence read retries at three more rotations, so
# an unbounded receipt can outlive the service manager's timeout and take the whole
# run down with it — including the pipelines that come after receipts.
ocr_request_timeout_seconds = 180   # one vision pass
ocr_budget_seconds = 420            # hard cap across every pass for one receipt
max_ocr_attempts = 3                # then fail the receipt so it can't wedge the worker

[email]
enabled = false
imap_host = "imap.example.com"
user = "receipts@example.com"
mailbox = "INBOX"
# IMAP_PASSWORD comes from .env

[receiver]
host = "127.0.0.1"
port = 8001
# RECEIPT_RECEIVER_TOKEN comes from .env

[history]
# Feed past categorizations from the budget into both pipelines as hints:
#   - single transactions get this payee's prior categories
#   - receipt line items get prior categories for the same item description
# History is read from the live budget, so manual corrections feed back in.
enabled = true
payee_top_n = 3    # prior categories to surface per payee (single transactions)
item_top_n = 3     # prior categories to surface per item description (receipt splits)
min_count = 1      # ignore categorizations seen fewer than this many times
